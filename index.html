<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استودیو طراحی و معماری افران</title>
  <meta name="description" content="استودیو طراحی و معماری افران — طراحی سازه، فضای مسکونی، برنامه‌ریزی شهری و طراحی داخلی.">
  <meta name="theme-color" content="#58585A">
  <meta property="og:type" content="website">
  <meta property="og:title" content="استودیو طراحی و معماری افران">
  <meta property="og:image" content="assets/images/projects/glass-office-dusk.jpg">
  <link rel="icon" href="assets/images/site/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/vazirmatn-arabic-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="home">
  <a class="skip-link" href="#main">پرش به محتوا</a>
  <div data-header="over"></div>

  <main id="main">
    <section class="hero" aria-labelledby="hero-title">
      <img class="hero__img" data-src="hero.image" data-alt="hero.image_alt" src="assets/images/projects/glass-office-dusk.jpg" alt="" fetchpriority="high">
      <div class="hero__shade"></div>
      <div class="hero__center">
        <h1 class="hero__title" id="hero-title" data-text="hero.title">افران</h1>
        <p class="hero__subtitle" data-text="hero.subtitle"></p>
      </div>
    </section>

    <section class="section container container--narrow">
      <div class="intro">
        <div class="intro__head">
          <span class="eyebrow">استودیو</span>
          <h2 class="h-1 pre-line" data-text="intro.heading"></h2>
          <span class="rule"></span>
        </div>
        <div class="intro__body">
          <p class="lead" data-text="intro.lead"></p>
          <p class="text" data-text="intro.text"></p>
          <a class="link-arrow" href="studio.html">درباره استودیو <span aria-hidden="true">⟵</span></a>
        </div>
      </div>
    </section>

    <section class="container" style="padding-bottom: var(--section)" aria-labelledby="projects-title">
      <div class="section-head">
        <h2 class="section-head__title"><span id="projects-title" data-text="projects_heading">پروژه‌های منتخب</span> <span class="section-head__count" id="home-count"></span></h2>
        <a href="projects.html">مشاهده همه پروژه‌ها <span aria-hidden="true">⟵</span></a>
      </div>
      <div class="chips" id="home-filters" role="group" aria-label="فیلتر بر اساس خدمت" style="padding: 18px 0 36px"></div>
      <div class="cards" id="home-cards" aria-live="polite"></div>
    </section>

    <section class="dark" id="approach" aria-labelledby="approach-title">
      <div class="container section">
        <div class="approach__head">
          <div style="flex: 1 1 420px">
            <span class="eyebrow">رویکرد</span>
            <h2 class="approach__heading" id="approach-title" data-text="approach.heading"></h2>
          </div>
          <p class="approach__text" data-text="approach.text"></p>
        </div>
        <div class="approach__grid" id="principles"></div>
      </div>
    </section>

    <section class="section container" id="services" aria-labelledby="services-title">
      <div class="services">
        <div class="services__head">
          <span class="eyebrow">خدمات</span>
          <h2 class="h-2" id="services-title" data-text="services_heading"></h2>
        </div>
        <div class="services__list" id="services-list"></div>
      </div>
    </section>

    <section class="quote-band">
      <img data-src="quote.image" data-alt="quote.image_alt" src="assets/images/projects/stone-wood-kitchen.jpg" alt="" loading="lazy">
      <div class="quote-band__shade"></div>
      <figure>
        <span class="dot" style="width: 12px; height: 12px"></span>
        <blockquote data-text="quote.text" data-quote></blockquote>
        <figcaption data-text="quote.caption"></figcaption>
      </figure>
    </section>

    <section class="section container container--narrow cta">
      <span class="eyebrow">پروژه‌های جدید</span>
      <h2 class="cta__heading" data-text="cta.heading"></h2>
      <p class="cta__text" data-text="cta.text"></p>
      <div class="cta__actions">
        <a class="btn" href="contact.html">گفت‌وگو را آغاز کنید <span aria-hidden="true">⟵</span></a>
        <a class="btn btn--outline" href="projects.html">آثار ما</a>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
