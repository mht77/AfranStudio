<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تماس — استودیو افران</title>
  <meta name="description" content="تماس با استودیو طراحی و معماری افران و شروع یک پروژه.">
  <meta name="theme-color" content="#58585A">
  <link rel="icon" href="assets/images/site/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/vazirmatn-arabic-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">پرش به محتوا</a>
  <div data-header></div>

  <main id="main" class="container">
    <div class="contact">
      <div class="contact__info">
        <div class="contact__head">
          <span class="eyebrow">تماس</span>
          <h1 class="contact__title">بیایید درباره پروژه شما گفت‌وگو کنیم.</h1>
          <span class="rule"></span>
        </div>
        <dl class="details" id="details"></dl>
      </div>

      <form class="form" id="contact-form" novalidate>
        <span class="eyebrow">شروع یک پروژه</span>
        <div class="form__row">
          <label class="field">نام
            <input type="text" name="name" autocomplete="name" required>
          </label>
          <label class="field">ایمیل یا شماره تماس
            <input type="text" name="contact" dir="ltr" style="text-align: right" required>
          </label>
        </div>
        <fieldset>
          <legend>نوع پروژه</legend>
          <div class="chips" id="project-types"></div>
        </fieldset>
        <label class="field">مکان پروژه
          <input type="text" name="location">
        </label>
        <label class="field">از پروژه بگویید
          <textarea name="message" rows="5" required></textarea>
        </label>
        <label class="hp" aria-hidden="true">نگذارید<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
        <div class="form__actions">
          <button class="btn" type="submit">ارسال پیام <span aria-hidden="true">⟵</span></button>
          <button class="btn btn--outline" type="button" id="send-whatsapp" hidden>ارسال در واتس‌اپ <span aria-hidden="true">↗</span></button>
        </div>
        <p class="form__status" id="form-status" role="status"></p>
      </form>
    </div>
  </main>

  <div data-footer></div>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
