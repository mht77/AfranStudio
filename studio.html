<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استودیو — افران</title>
  <meta name="description" content="درباره استودیو طراحی و معماری افران، رویکرد و فرایند کار.">
  <meta name="theme-color" content="#58585A">
  <script>
    // Mark the first page of a visit (intro) or a page reached through a transition, so CSS covers it
    // from the first paint until app.js takes over (see "Motion" in app.js).
    (function () {
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var s = sessionStorage, c = !s.getItem("afran-intro") ? "fx-intro" : s.getItem("afran-go") ? "fx-enter" : "";
        if (c) document.documentElement.classList.add(c);
      } catch (e) { /* no storage: no transitions */ }
    })();
  </script>
  <link rel="icon" href="assets/images/site/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/vazirmatn-arabic-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="studio">
  <a class="skip-link" href="#main">پرش به محتوا</a>
  <div data-header></div>

  <main id="main">
    <div class="container">
      <div class="page-head">
        <div class="page-head__title" style="flex: 3 1 520px">
          <span class="eyebrow">استودیو</span>
          <h1 class="h-display" style="font-size: clamp(30px, 3.8vw, 54px); line-height: 1.4" data-text="heading"></h1>
        </div>
        <p class="page-head__text" style="flex: 2 1 320px" data-text="text"></p>
      </div>
    </div>

    <div class="split">
      <img class="split__img" data-src="image" data-alt="image_alt" alt="">
      <div class="mark-card">
        <svg viewBox="0 0 239 257" aria-hidden="true"><rect class="b-g" x="0" y="0" width="62" height="72"/><rect class="b-w" x="117" y="0" width="122" height="72"/><rect class="b-w" x="0" y="93" width="152" height="70"/><rect class="b-w" x="0" y="184" width="95" height="73"/><rect class="b-g" x="152" y="184" width="87" height="73"/></svg>
        <div>
          <span class="eyebrow">نشان</span>
          <p data-text="mark_text"></p>
        </div>
      </div>
    </div>

    <section class="dark" id="services" aria-labelledby="services-title">
      <div class="container section services">
        <div class="services__head">
          <span class="eyebrow">خدمات</span>
          <h2 class="h-2" id="services-title" data-text="services_heading" style="font-weight: 200"></h2>
        </div>
        <div class="services__list" id="services-list"></div>
      </div>
    </section>

    <section class="section container container--narrow cta-split">
      <h2 class="cta-split__heading" data-text="cta_heading"></h2>
      <div class="cta-split__actions">
        <a class="btn btn--outline" href="team.html">آشنایی با تیم</a>
        <a class="btn" href="contact.html">در تماس باشید <span aria-hidden="true">⟵</span></a>
      </div>
    </section>
  </main>

  <div data-footer></div>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
