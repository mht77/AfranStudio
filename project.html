<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروژه — استودیو افران</title>
  <meta name="description" content="پروژه‌ای از استودیو طراحی و معماری افران.">
  <meta name="theme-color" content="#58585A">
  <script>
    // Mark the first page of a visit (intro) or a page reached through a transition, so CSS covers it
    // from the first paint until app.js takes over (see "Motion" in app.js).
    (function () {
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var s = sessionStorage, c = !s.getItem("afran-intro") ? "fx-intro" : s.getItem("afran-go") ? "fx-enter" : "";
        if (c) document.documentElement.classList.add(c);
      } catch (e) { /* no storage: no transitions */ }
    })();
  </script>
  <link rel="icon" href="assets/images/site/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/vazirmatn-arabic-300-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="project">
  <a class="skip-link" href="#main">پرش به محتوا</a>
  <div data-header></div>

  <main id="main">
    <section class="slideshow" id="slideshow" aria-roledescription="carousel" aria-label="گالری تصاویر پروژه">
      <div class="slideshow__stage" tabindex="0" aria-label="برای جابه‌جایی از کلیدهای جهت استفاده کنید">
        <button class="slideshow__zone slideshow__zone--prev" type="button" data-prev aria-label="تصویر قبلی"></button>
        <button class="slideshow__zone slideshow__zone--next" type="button" data-next aria-label="تصویر بعدی"></button>
      </div>
      <div class="slideshow__bar">
        <p class="slideshow__caption" aria-live="polite"></p>
        <div class="slideshow__controls">
          <div class="slideshow__bars" aria-hidden="true"></div>
          <p class="slideshow__count"><span data-now style="color: inherit"></span> <span>/ <span data-all></span></span></p>
          <div class="slideshow__btns">
            <button type="button" data-prev aria-label="تصویر قبلی">→</button>
            <button type="button" data-next aria-label="تصویر بعدی">←</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section container">
      <div class="project-head">
        <a class="project-head__back" href="projects.html">→ همه پروژه‌ها</a>
        <div class="project-head__row">
          <h1 class="project-head__title" data-text="title"></h1>
          <p class="project-head__place"><span class="dot"></span><span data-text="location"></span></p>
        </div>
      </div>
      <div class="story">
        <div class="story__body">
          <p class="story__summary" data-text="summary"></p>
          <div data-paras="description" style="display: flex; flex-direction: column; gap: 22px"></div>
        </div>
        <dl class="facts" id="facts"></dl>
      </div>
    </section>

    <section class="section container container--narrow pull-quote" id="project-quote">
      <span class="dot"></span>
      <blockquote data-text="quote" data-quote></blockquote>
      <cite data-text="quote_author"></cite>
    </section>

    <a class="next-project" id="next-project" href="projects.html" style="margin-top: var(--section)">
      <span class="eyebrow">پروژه بعدی</span>
      <span class="next-project__title" data-text="next.title"></span>
      <span class="next-project__place"><span class="dot"></span><span data-text="next.location"></span> ⟵</span>
    </a>
  </main>

  <div data-footer></div>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
